status = warn

# An explicit appender is required: a configuration without appenders makes log4j2 drop all events silently.
# Everything goes to the console, so Maven shows the logs and no log files are created during builds.
appender.console.type = Console
appender.console.name = LogToConsole
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = T [%-5level] %d{HH:mm:ss.SSS} [%t] %c{20} - %msg%n
# V11: follow System.setOut/setErr so @StdIo captures webapp log lines; the security audit logger logs at INFO while the root stays WARN.
appender.console.follow = true

rootLogger.level = warn
rootLogger.appenderRef.console.ref = LogToConsole

logger.audit.name = org.openl.security.audit
logger.audit.level = info
