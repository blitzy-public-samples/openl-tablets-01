# V2: Rule Services with JWT authentication and the REST deployer both enabled, deploying into a writable file repository under openl.home instead of the checked-in openl-repository/deployments
ruleservice.authentication.enabled = true
ruleservice.authentication.iss = itest
ruleservice.authentication.jwks = file:target/jwt-deploy/jwks.json
ruleservice.deployer.enabled = true
production-repository.factory = repo-file
production-repository.uri = ${openl.home}/file-repository
