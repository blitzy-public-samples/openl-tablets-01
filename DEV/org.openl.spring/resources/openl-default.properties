# OpenL Tablets working directory that stores data for each instance.
openl.home = ${user.home}/.openl

# OpenL Tabletws shared working directory for clustered systems.
# It must match the openl.home property value.
# It points to the shared mount between instances to synchronize the data.
openl.home.shared = ${openl.home}

# V6: saved secrets use the ENC(v2:...) AES-256-GCM format; the openssl recipe below produces the legacy format.
# A secret key (a master password) for encode/decode values of the properties.
# If this property is not blank then encoded values can be defined inside of ENC(...), like:
# my-property.password=ENC(${ENCODED_VALUE})
secret.key = ${repository.encode.decode.key}
# Settings saved by the application whose names end in "password", "secret" or "token"
# (except secret.key itself) are stored encrypted in the v2 format:
#
# 1. Derive a 256-bit key from the secret key by PBKDF2WithHmacSHA256 with 600,000 iterations
#    and a random 16-byte salt generated for each value;
# 2. Encrypt the value in UTF-8 encoding by AES 256 bit algorithm with GCM mode, a random 12-byte nonce,
#    a 128-bit authentication tag and the additional authenticated data "openl-enc-v2";
# 3. Encode salt + nonce + ciphertext with the tag into a Base64 string;
# 4. Wrap the Base64 string into ENC(v2:...) without whitespaces inside.
#
# If secret.key is blank, a random instance key is generated in ${openl.home.shared}/.openl-secret-key
# on the first save of such a setting and is used instead. A configured secret.key always takes precedence.
# Move the key file together with the settings file, or configure secret.key before the first save.
# If the key file is lost, the values encrypted with it cannot be read.
#
# Legacy format: values inside ENC(...) without the "v2:" prefix are still accepted on read. Legacy and plain-text
# values of the settings above are re-encrypted in the v2 format on the next save. Hand-encoded legacy values
# require secret.key to be set. The algorithm of the legacy encoding is the following:
#
# 1. Make SHA-1 hash of the secret key in UTF-8 encoding;
# 2. Get the first 32 symbols of the SHA-1 as a key;
# 3. Encrypt the value in UTF-8 encoding by AES 128 bit algorithm with CBC mode, PKCS5 padding, zero initialization vector;
# 4. Encode the AES binary into a Base64 string;
# 5. Wrap the Base64 string into ENC(...) without whitespaces inside.
#
# You can use the following linux shell command to create a value encoded in the legacy format:
#
#    echo -n "${PLAIN_VALUE}" \
#      | openssl aes-128-cbc \
#        -K $(echo -n "${SECRET_KEY}" | sha1sum | awk '{ print substr($1, 1, 32) }') \
#        -e \
#        -iv 00000000000000000000000000000000 \
#        -base64 \
#      | awk '{ print "ENC("$1")" }'
#
# where ${SECRET_KEY} is the value of the secret.key property and ${PLAIN_VALUE} is the value to encode.
# Note: You can encode any properties, not only passwords.

# Encoding cipher (legacy ENC(...) values only).
secret.cipher = AES/CBC/PKCS5Padding

# Property used for backward compatibility. Use secret.key instead.
repository.encode.decode.key =

##########################################
# Important: Do not override these properties
# in the application level properties files,
# such as application.properties.
# It will not work.
openl.config.location = ${spring.config.location: classpath*:application*-default.properties, classpath:, classpath:config/, file:./, file:conf/, file:config/, file:${user.home}/}
openl.config.name = ${spring.config.name: application.properties, application-{profile}.properties, {appName}.properties, {appName}-{profile}.properties}
##########################################

# To protect against the JNDI injection and unauthorized access to private data.
# RegExp pattern for white and black lists, to restrict access for property keys available for the application.
openl.config.key-pattern.allowed = [\\d\\w.$-]+
openl.config.key-pattern.denied =
